name: daily-scrape
on:
  schedule:
    - cron: '0 10 * * *' # todo dia 10:00 UTC
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Sync & run
        run: |
          uv sync
          uv run python main.py --all
      - name: Upload data
        uses: actions/upload-artifact@v4
        with:
          name: raw-data
          path: data/raw
